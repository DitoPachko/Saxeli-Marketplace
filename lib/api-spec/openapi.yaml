openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: marketplace
    description: Saxeli marketplace operations
  - name: profile
    description: Seller profile and inbox operations
  - name: ai
    description: AI-assisted listing tools
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /items:
    get:
      operationId: listItems
      tags: [marketplace]
      summary: List marketplace items
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 12
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Marketplace items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceItem"
    post:
      operationId: createItem
      tags: [marketplace]
      summary: Create a marketplace listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created marketplace item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItem"
  /categories:
    get:
      operationId: listCategories
      tags: [marketplace]
      summary: List the marketplace category hierarchy
      responses:
        "200":
          description: Flat category records ordered for tree construction
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /items/{id}:
    get:
      operationId: getItem
      tags: [marketplace]
      summary: Get a marketplace item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marketplace item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItem"
        "404":
          description: Item not found
    post:
      operationId: toggleItemFavorite
      tags: [marketplace]
      summary: Toggle an item favorite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated favorite state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteState"
    patch:
      operationId: updateItem
      tags: [marketplace]
      summary: Update an owned marketplace listing
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated marketplace item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItem"
        "403": { description: Listing is not owned by the current user }
        "404": { description: Item not found }
    delete:
      operationId: deleteItem
      tags: [marketplace]
      summary: Delete an owned marketplace listing
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: Listing deleted }
        "403": { description: Listing is not owned by the current user }
        "404": { description: Item not found }
  /favorites:
    get:
      operationId: listFavoriteItems
      tags: [profile, marketplace]
      summary: List the current user's saved items
      responses:
        "200":
          description: Current user's saved marketplace items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceItem"
  /profile:
    get:
      operationId: getCurrentProfile
      tags: [profile]
      summary: Get the current user profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateCurrentProfile
      tags: [profile]
      summary: Update editable current user profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /profile/listings:
    get:
      operationId: listMyItems
      tags: [profile, marketplace]
      summary: List listings owned by the current user
      responses:
        "200":
          description: Current user listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceItem"
  /sellers/{id}:
    get:
      operationId: getSellerProfile
      tags: [profile]
      summary: Get a seller's public profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Seller public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProfile"
        "404": { description: Seller not found }
  /profile/summary:
    get:
      operationId: getProfileSummary
      tags: [profile]
      summary: Get the current profile summary
      responses:
        "200":
          description: Profile summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
  /messages:
    get:
      operationId: listMessages
      tags: [profile]
      summary: List conversations for the current user
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /listings/{listingId}/conversation:
    get:
      operationId: getListingConversation
      tags: [profile]
      summary: Get the current user's conversation for a listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404": { description: Conversation not found }
    post:
      operationId: createListingConversation
      tags: [profile]
      summary: Create or get the buyer conversation for a listing
      parameters:
        - $ref: "#/components/parameters/ListingId"
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "403": { description: The seller cannot message themselves }
        "404": { description: Listing not found }
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [profile]
      summary: Load conversation message history
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Messages ordered oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "403": { description: Not a conversation participant }
        "404": { description: Conversation not found }
    post:
      operationId: sendConversationMessage
      tags: [profile]
      summary: Send a message in a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400": { description: Message text is empty or too long }
        "403": { description: Not a conversation participant }
        "404": { description: Conversation not found }
  /conversations/{conversationId}/events:
    get:
      operationId: conversationEvents
      tags: [profile]
      summary: Subscribe to new conversation messages with Server-Sent Events
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Native Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "403": { description: Not a conversation participant }
        "404": { description: Conversation not found }
  /ai-analyze:
    post:
      operationId: analyzeItemImage
      tags: [ai]
      summary: Analyze an item photo for listing autofill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemAnalysisInput"
      responses:
        "200":
          description: Suggested listing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemAnalysis"
        "503":
          description: AI analysis is unavailable
components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Seller:
      type: object
      required: [id, name, initials, rating, listings]
      properties:
        id: { type: string }
        name: { type: string }
        initials: { type: string }
        rating: { type: number }
        listings: { type: number }
        responseTime: { type: string }
        avatarUrl: { type: [string, "null"] }
        city: { type: [string, "null"] }
        phoneNumber: { type: [string, "null"] }
    MarketplaceItem:
      type: object
      required:
        - id
        - title
        - price
        - category
        - categorySlug
        - condition
        - city
        - district
        - postedAt
        - image
        - seller
        - negotiable
        - tradeAvailable
        - deliveryAvailable
        - chatOnly
      properties:
        id: { type: string }
        title: { type: string }
        price: { type: number }
        category: { type: string }
        categorySlug: { type: string }
        condition: { type: string }
        city: { type: string }
        district: { type: string }
        postedAt: { type: string }
        image: { type: string }
        images:
          type: array
          items: { type: string }
        description: { type: string }
        seller:
          $ref: "#/components/schemas/Seller"
        isFavorite: { type: boolean }
        delivery:
          type: array
          items: { type: string }
        negotiable: { type: boolean }
        tradeAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        phone: { type: [string, "null"] }
        chatOnly: { type: boolean }
    ItemInput:
      type: object
      required: [title, price, category, condition, city, district, image, description, negotiable, tradeAvailable, deliveryAvailable, chatOnly]
      properties:
        title: { type: string, minLength: 2 }
        price: { type: number, minimum: 0 }
        category: { type: string }
        condition: { type: string }
        city: { type: string }
        district: { type: string, minLength: 1 }
        image: { type: string }
        description: { type: string }
        delivery:
          type: array
          items: { type: string }
        negotiable: { type: boolean }
        tradeAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        phone: { type: [string, "null"] }
        chatOnly: { type: boolean }
    ItemUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 2 }
        price: { type: number, minimum: 0 }
        category: { type: string }
        condition: { type: string }
        city: { type: string }
        district: { type: string }
        image: { type: string }
        images:
          type: array
          items: { type: string }
        description: { type: string }
        delivery:
          type: array
          items: { type: string }
        negotiable: { type: boolean }
        tradeAvailable: { type: boolean }
        deliveryAvailable: { type: boolean }
        phone: { type: [string, "null"] }
        chatOnly: { type: boolean }
    Category:
      type: object
      required: [id, name, slug, depth, sortOrder]
      properties:
        id: { type: string }
        parentId: { type: [string, "null"] }
        name: { type: string }
        icon: { type: [string, "null"] }
        slug: { type: string }
        depth: { type: number }
        sortOrder: { type: number }
    UserProfile:
      type: object
      required: [id, fullName, email, phoneNumber, city, avatarUrl]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: string }
        phoneNumber: { type: [string, "null"] }
        city: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1 }
        phoneNumber: { type: [string, "null"] }
        city: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
    SellerProfile:
      type: object
      required: [id, fullName, city, avatarUrl, listings]
      properties:
        id: { type: string }
        fullName: { type: string }
        city: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
        listings: { type: number }
    FavoriteState:
      type: object
      required: [id, isFavorite]
      properties:
        id: { type: string }
        isFavorite: { type: boolean }
    ProfileSummary:
      type: object
      required: [name, initials, rating, activeListings, savedItems, unreadMessages]
      properties:
        name: { type: string }
        initials: { type: string }
        rating: { type: number }
        activeListings: { type: number }
        savedItems: { type: number }
        unreadMessages: { type: number }
    Conversation:
      type: object
      required: [id, listingId, buyerId, sellerId, createdAt, updatedAt]
      properties:
        id: { type: string }
        listingId: { type: string }
        buyerId: { type: string }
        sellerId: { type: string }
        listingTitle: { type: ["string", "null"] }
        listingImage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversationId, senderId, text, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: string }
        text: { type: string }
        createdAt: { type: string, format: date-time }
    MessageInput:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
    ItemAnalysisInput:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: Base64-encoded image data URL
    ItemAnalysis:
      type: object
      required: [title, category, estimatedPrice, description]
      properties:
        title: { type: string }
        category: { type: string }
        estimatedPrice: { type: number }
        description: { type: string }

